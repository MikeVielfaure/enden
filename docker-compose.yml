

services:
  postgres_db:
      image: postgres:15
      container_name: postgres_db
      restart: unless-stopped
      env_file:
        - .env  # Contient les variables d'environnement pour la DB
      ports:
        - "5433:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      networks:
        - backend_network  # Utilisation d'un réseau Docker externe

  backend:
    build:
      context: ./backend
    container_name: fastapi_backend
    depends_on:
      - postgres_db  # Dépendance explicite
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/code
    env_file:
      - .env 
    environment:
      DATABASE_URL: "postgresql://mike:viel@postgres_db:5432/test"  
    networks:
      - backend_network  

volumes:
  pgdata:

networks:
  backend_network:
    external: true  
